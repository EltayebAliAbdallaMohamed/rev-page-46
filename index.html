<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro LS - Page 46</title>

  <!-- Reveal.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4/dist/reset.css">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4/dist/reveal.css">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js@4/dist/theme/black.css">
  <link rel="stylesheet" href="custom.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #1a1a1a;
    }

    .reveal {
      background: #1a1a1a;
    }

    .reveal .slides {
      background: #1a1a1a;
    }

    .reveal .slides section {
      text-align: center;
      padding: 60px 40px 100px 40px;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reveal .slides section figure {
      margin: 0 auto;
      max-width: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .audio-title {
      font-size: 1.8em;
      font-weight: bold;
      margin-bottom: 30px;
      color: #00d4ff;
      text-shadow: 0 2px 10px rgba(0, 212, 255, 0.3);
      letter-spacing: 1px;
    }

    .reveal .slides section audio {
      width: 90%;
      max-width: 600px;
      margin: 30px auto;
      display: block;
      min-height: 50px;
      border-radius: 8px;
      background: #333;
      padding: 5px;
    }

    .reveal .slides section details {
      margin: 30px auto;
      font-size: 1.1em;
      text-align: left;
      width: 90%;
      max-width: 700px;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 0;
      border: 2px solid #444;
    }

    .reveal .slides section details summary {
      cursor: pointer;
      font-weight: bold;
      font-size: 1.2em;
      padding: 20px;
      background: linear-gradient(90deg, #00d4ff 0%, #0099cc 100%);
      color: #000;
      border-radius: 6px;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
    }

    .reveal .slides section details summary:hover {
      background: linear-gradient(90deg, #00e5ff 0%, #00b3e5 100%);
      transform: translateX(5px);
    }

    .reveal .slides section details summary:focus {
      outline: 3px solid #ffff00;
      outline-offset: 2px;
    }

    .reveal .slides section details summary::before {
      content: "▶ ";
      display: inline-block;
      margin-right: 10px;
      transition: transform 0.3s ease;
    }

    .reveal .slides section details[open] summary::before {
      transform: rotate(90deg);
    }

    .reveal .slides section .script-text {
      max-height: 300px;
      overflow-y: auto;
      padding: 20px;
      line-height: 1.9;
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-size: 1.05em;
      border-top: 2px solid #00d4ff;
    }

    .reveal .slides section p {
      font-size: 1.4em;
      line-height: 1.8;
      margin: 18px 0;
      color: #e0e0e0;
    }

    /* Arabic text styling */
    .reveal .slides section p:nth-of-type(odd) {
      color: #ffb700;
      font-size: 1.3em;
    }

    /* Navigation controls styling */
    .reveal .controls {
      bottom: 80px;
    }

    .reveal .controls button {
      width: 50px;
      height: 50px;
      font-size: 20px;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.8);
      border: none;
      color: #000;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .reveal .controls button:hover {
      background: rgba(0, 212, 255, 1);
      transform: scale(1.1);
    }

    .reveal .controls button:focus {
      outline: 3px solid #ffff00;
      outline-offset: 2px;
    }

    /* Progress bar */
    .reveal .progress {
      height: 4px;
      background: rgba(0, 212, 255, 0.3);
    }

    .reveal .progress span {
      background: linear-gradient(90deg, #00d4ff, #00ff88);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }

    /* Tablet screens (768px and below) */
    @media (max-width: 768px) {
      .reveal .slides section {
        padding: 40px 20px 100px 20px;
        min-height: auto;
      }

      .audio-title {
        font-size: 1.4em;
        margin-bottom: 20px;
      }

      .reveal .slides section audio {
        width: 95%;
        max-width: 500px;
        min-height: 45px;
      }

      .reveal .slides section p {
        font-size: 1.1em;
      }

      .reveal .slides section details {
        width: 95%;
        max-width: 100%;
      }

      .reveal .slides section details summary {
        font-size: 1em;
        padding: 15px;
      }

      .reveal .slides section .script-text {
        font-size: 0.95em;
        max-height: 250px;
        padding: 15px;
      }

      .reveal .controls {
        bottom: 70px;
      }

      .reveal .controls button {
        width: 45px;
        height: 45px;
        font-size: 18px;
      }
    }

    /* Small mobile screens (480px and below) */
    @media (max-width: 480px) {
      .reveal .slides section {
        padding: 30px 15px 90px 15px;
      }

      .audio-title {
        font-size: 1.1em;
        margin-bottom: 15px;
      }

      .reveal .slides section audio {
        width: 98%;
        max-width: 100%;
        min-height: 45px;
      }

      .reveal .slides section p {
        font-size: 0.95em;
        margin: 12px 0;
      }

      .reveal .slides section details {
        width: 98%;
        margin: 15px auto;
      }

      .reveal .slides section details summary {
        font-size: 0.9em;
        padding: 12px;
      }

      .reveal .slides section .script-text {
        font-size: 0.85em;
        max-height: 200px;
        padding: 12px;
      }

      .reveal .controls {
        bottom: 60px;
      }

      .reveal .controls button {
        width: 40px;
        height: 40px;
        font-size: 16px;
      }

      .reveal .slide-number {
        font-size: 12px;
        bottom: 70px;
      }
    }

    /* Very small screens (320px and below) */
    @media (max-width: 320px) {
      .reveal .slides section {
        padding: 25px 10px 85px 10px;
      }

      .audio-title {
        font-size: 0.95em;
      }

      .reveal .slides section p {
        font-size: 0.85em;
      }
    }

    /* Large desktop screens (1200px and above) */
    @media (min-width: 1200px) {
      .reveal .slides section {
        padding: 80px 60px 120px 60px;
      }

      .audio-title {
        font-size: 2.2em;
        margin-bottom: 40px;
      }

      .reveal .slides section audio {
        width: 80%;
        max-width: 700px;
        min-height: 60px;
      }

      .reveal .slides section p {
        font-size: 1.6em;
      }

      .reveal .slides section details {
        width: 80%;
        max-width: 800px;
      }

      .reveal .slides section details summary {
        font-size: 1.4em;
        padding: 25px;
      }

      .reveal .slides section .script-text {
        font-size: 1.2em;
        max-height: 350px;
        padding: 25px;
      }

      .reveal .controls button {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }

    /* Keyboard navigation indicator */
    button:focus,
    a:focus,
    details:focus {
      outline: 3px solid #ffff00;
      outline-offset: 2px;
    }

    /* Skip navigation for screen readers */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #2a2a2a;
    }

    ::-webkit-scrollbar-thumb {
      background: #00d4ff;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00e5ff;
    }
  </style>
</head>

  <!-- Footer -->

  <!-- Reveal.js scripts -->
  <script src="https://unpkg.com/reveal.js@4/dist/reveal.js"></script>
  <script src="https://unpkg.com/reveal.js@4/plugin/notes/notes.js"></script>
  <script src="https://unpkg.com/reveal.js@4/plugin/markdown/markdown.js"></script>
  <script src="https://unpkg.com/reveal.js@4/plugin/highlight/highlight.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      controls: true,
      controlsLayout: 'edges',
      progress: true,
      slideNumber: 'c/t',
      transition: 'slide',
      transitionSpeed: 'default',
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      touch: true,
      mobileViewportScale: 1.0,
      width: '100%',
      height: '100%',
      margin: 0
    });

    Reveal.on('slidechanged', event => {
      event.currentSlide.querySelectorAll('details').forEach(d => {
        d.open = false;
      });

      const audios = event.currentSlide.querySelectorAll('audio');
      audios.forEach(audio => {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      });
    });
  </script>
