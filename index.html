<!-- Reveal.js CDN Scripts -->
<script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>
<script src="https://unpkg.com/reveal.js/plugin/notes/notes.js"></script>
<script src="https://unpkg.com/reveal.js/plugin/markdown/markdown.js"></script>
<script src="https://unpkg.com/reveal.js/plugin/highlight/highlight.js"></script>

<script>
Reveal.initialize({
    hash: true,
    controls: true,
    controlsLayout: 'edges',
    touch: true,
    keyboard: true,
    slideNumber: 'c/t',
    showSlideNumber: 'all',
    transition: 'slide',
    progress: true,
    plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
});
</script>

<footer class="global-footer">
    Created by: Eltayeb Mohamed <br>
    King Saud University - First Common Year
</footer>

<!-- Auto-close <details> -->
<script>
Reveal.on('slidechanged', event => {
    event.currentSlide.querySelectorAll('details').forEach(d => {
        d.open = false;
    });
});
</script>

<!-- Auto-play audio -->
<script>
Reveal.on('slidechanged', event => {
    const audios = event.currentSlide.querySelectorAll('audio');
    audios.forEach(audio => {
        audio.currentTime = 0;
        audio.play().catch(() => {});
    });
});
</script>
